name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    needs: voices
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Require Windows updater signing key
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Configure the TAURI_SIGNING_PRIVATE_KEY repository secret before building Windows installers.'
          }
      - run: npm run build
      - run: npm test
      - run: npm run native
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.os == 'Windows' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: voice-packages
          path: src-tauri/target/voice-packages
      - name: Verify packaged Windows speech runtime
        if: runner.os == 'Windows'
        run: python scripts/check-local-voices.py src-tauri/binaries/speech-helper-x86_64-pc-windows-msvc.exe
      - uses: actions/upload-artifact@v4
        with:
          name: hej-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.sig
          if-no-files-found: error
  release:
    name: Publish installers
    needs: [build, voices]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: hej-*
          path: installers
      - uses: actions/download-artifact@v4
        with:
          name: voice-packages
          path: voice-packages
      - name: Generate signed Windows update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/create-update-manifest.mjs installers "$GITHUB_REPOSITORY" "$RELEASE_TAG" latest.json
      - name: Publish immutable voice packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=speech-models-v1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --latest=false \
              --target "$GITHUB_SHA" --title 'Swedish voices v1' \
              --notes 'Offline Alma (CC BY 4.0), NST (MIT; dataset CC0), and Supertonic 3 (OpenRAIL-M weights; MIT code) voice packages. Attribution and licenses are included in each package.'
          fi
          mkdir existing-voices
          for asset in voice-packages/*.zip; do
            name="$(basename "$asset")"
            if gh release download "$tag" --pattern "$name" --dir existing-voices; then
              cmp "$asset" "existing-voices/$name"
            else
              gh release upload "$tag" "$asset"
            fi
          done
          if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" == true ]]; then
            gh release edit "$tag" --draft=false --latest=false
          fi
      - name: Create release and attach installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=()
          for extension in exe msi dmg sig; do
            found=false
            while IFS= read -r -d '' installer; do
              assets+=("$installer")
              found=true
            done < <(find installers -type f -name "*.$extension" -print0)
            if [[ "$found" != true ]]; then
              echo "Missing .$extension installer; release will not be published." >&2
              exit 1
            fi
          done
          assets+=(latest.json)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            prerelease=false
            if [[ "$RELEASE_TAG" == *-* ]]; then
              prerelease=true
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --draft --generate-notes \
              --title "Hej $RELEASE_TAG" --prerelease="$prerelease"
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
  voices:
    name: Verify voice packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/voice-requirements.txt
      - run: python scripts/prepare-voices.py
      - uses: actions/upload-artifact@v4
        with:
          name: voice-packages
          path: src-tauri/target/voice-packages/hej-voice-*-v1.zip
          if-no-files-found: error
