name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run native
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: hej-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
  release:
    name: Publish installers
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hej-*
          path: installers
      - name: Create release and attach installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=()
          for extension in exe msi dmg; do
            found=false
            while IFS= read -r -d '' installer; do
              assets+=("$installer")
              found=true
            done < <(find installers -type f -name "*.$extension" -print0)
            if [[ "$found" != true ]]; then
              echo "Missing .$extension installer; release will not be published." >&2
              exit 1
            fi
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            prerelease=false
            if [[ "$RELEASE_TAG" == *-* ]]; then
              prerelease=true
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --draft --generate-notes \
              --title "Hej $RELEASE_TAG" --prerelease="$prerelease"
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
